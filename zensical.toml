[project]
extra_css = [
    "assets/stylesheets/extra.css",
    "assets/stylesheets/admonitions.css",
    "assets/stylesheets/github_tables.css"
]
extra_javascript = [
    "assets/javascripts/mathjax.js",
    "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js",
]

# Site Data

site_name = "UIowa HPC Documentation"
site_description = "Documentation for the Supercomputing system at the University of Iowa"
site_author = "ITS-OTLT-Research Services, The University of Iowa"
site_url = "https://uiowa-research.github.io/argon/"
repo_url = "https://github.com/uiowa-research/argon"
copyright = """
Copyright &copy; 2026 The University of Iowa
"""

# Table of Contents

nav = [
   { "Home" = "index.md" },
   { "Getting Started HPC" = [
		"get_started/overview/index.md",
		{ "Access" = "get_started/access/index.md" }]
   },
   { "Resource" = "resources/compute_resources/index.md" },
   { "Software" = [
		"software/overview/index.md",
		{ "Modules" = "software/modules/index.md" },
		{ "Popular Software" = [
			"software/overview/index.md", # need to be updated
			{ "Python" = "software/popular_software/python/index.md" },
			{ "Jupyter Notebook" = "software/popular_software/jupyter/index.md" },
			{ "R" = [
				"software/overview/index.md", #need to be updated
				{ "Personal Library" = "software/popular_software/R/rlibrary/index.md" },
				{ "Batch Jobs" = "software/popular_software/R/rbatch/index.md"}
			]}
		]},
		{"Containers" = "software/containers/index.md"}
	]}
]


# Stylization

[project.extra.status]
new = "Recently added"
updated = "Updates" 
deprecated = "Deprecated"

[project.extra.annotate]

[project.theme]
custom_dir = "docs/overrides"
favicon = "assets/images/favicon.ico"
logo = "assets/images/home/TOP-IOWA-Black-Tab-ffcd00.png"

features = [
    "navigation.indexes",
    "toc.integrate",
    "navigation.path",
    "navigation.top",
    "navigation.tracking",
    "content.code.annotate"
]

#variant = "classic"
#primary = "custom"

[[project.theme.palette]] 
scheme = "uofa_light"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"



