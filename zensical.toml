   },
   { "Resource" = "resources/compute_resources/index.md" },
   { "Software" = [
		"software/overview/index.md",
		{ "Modules" = "software/modules/index.md" },
		{ "Popular Software" = [
			"software/popular_software/index.md", # need to be updated
			{ "Python" = "software/popular_software/python/index.md" },
			{ "Jupyter Notebook" = "software/popular_software/jupyter/index.md" },
			{ "R" = [
				"software/overview/index.md", #need to be updated
				{ "Personal Library" = "software/popular_software/R/rlibrary/index.md" },
				{ "Batch Jobs" = "software/popular_software/R/rbatch/index.md" }
			]}
		]},
		{"Containers" = "software/containers/index.md" }
   ]},
   { "Running Jobs" = [
		"running_jobs/overview/index.md",
		{ "Interactive Sessions" = "running_jobs/interactive/index.md" },
		{ "Batch Jobs" = "running_jobs/batch_jobs/index.md" },
		{ "Array Jobs" = "running_jobs/array_jobs/index.md" }
   ]},
   { "Data Management" = [
		"data_management/overview/index.md",
		{ "GLOBUS" = "data_management/globus/index.md" }
   ]},
   { "Support" = [
		"support/index.md",
		{ "ACCESS Application" = "support/nsf_access/index.md" },
		{ "Consultation" = "support/consultation/index.md" }
   ]},
   { "Workshops" = [
		"workshops/overview/index.md",
